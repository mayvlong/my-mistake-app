    toast('图片处理失败：' + (e.message || '未知错误'), 4000);
  }
}

/* 压缩 + 处理 EXIF 方向（避免 iOS 拍照旋转） */
async function compressImage(file) {
  const maxSide = APP.maxImageSide;
  let bitmap = null;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e1) {
    try { bitmap = await createImageBitmap(file); } catch (e2) { bitmap = null; }
  }

  function sizeOf(w, h) {
    let nw = w, nh = h;
    if (Math.max(w, h) > maxSide) {
      const r = maxSide / Math.max(w, h);
      nw = Math.round(w * r);
      nh = Math.round(h * r);
    }
    return { w: nw, h: nh };
  }
  function toBlob(canvas) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (b) {
        if (b) resolve(b);
        else {
          try {
            const dataUrl = canvas.toDataURL('image/jpeg', APP.imageQuality);
            resolve(dataUrlToBlob(dataUrl));
          } catch (e) { reject(e); }
        }
      }, 'image/jpeg', APP.imageQuality);
    });
  }

  if (bitmap) {
    const s = sizeOf(bitmap.width, bitmap.height);
    const canvas = document.createElement('canvas');
    canvas.width = s.w; canvas.height = s.h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, s.w, s.h);
    ctx.drawImage(bitmap, 0, 0, s.w, s.h);
    if (bitmap.close) bitmap.close();
    return toBlob(canvas);
  }

  // 兜底：<img> 解码（多数浏览器会按 EXIF 自动纠正方向）
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise(function (resolve, reject) {
      const im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () { reject(new Error('图片解码失败')); };
      im.src = url;
    });
    const s = sizeOf(img.naturalWidth || img.width, img.naturalHeight || img.height);
    const canvas = document.createElement('canvas');
    canvas.width = s.w; canvas.height = s.h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, s.w, s.h);
    ctx.drawImage(img, 0, 0, s.w, s.h);
    return await toBlob(canvas);
  } finally {
    URL.revokeObjectURL(url);
  }
}

const PICK_FIELDS_MISTAKE = ['type', 'stem', 'answer', 'analysis', 'knowledgePoint', 'initErrorReason', 'stuckNote', 'hint'];
const PICK_FIELDS_VOCAB = ['subType', 'front', 'phonetic', 'back', 'example', 'mySentence', 'initErrorReason'];
const FIELD_IMAGE_FIELDS = ['stuckNote', 'answer', 'analysis', 'hint'];

/* 图片类错误 -> 给用户看的一句话（文字与图片的失败必须分开说） */
function imageErrText(e) {
  if (e && e.name === 'IMAGE_QUOTA_EXCEEDED') return '图片过大或本地存储已满，本题只保存了文字，建议导出备份';
  return '当前环境不支持保存图片，本题只保存了文字';
}

async function saveItem() {
  const f = S.form;
  if (!f) return;
  const data = f.data;
  const subject = getSubject(f.subjectId);
  if (!subject) return;

  // ---------- 1. 文字校验 ----------
  if (f.template === 'mistake') {
    if (!data.imageKey && !f.imageBlob && !String(data.stem || '').trim()) {
      toast('至少写一句题干，或者选一张题图');
      return;
    }
  } else {
    if (!String(data.front || '').trim()) { toast('正面内容不能空'); return; }
    if (!String(data.back || '').trim()) { toast('背面内容不能空'); return; }
  }

  // ---------- 2. 先只写文字：保证「文字一定存进去」 ----------
  const pick = f.template === 'mistake' ? PICK_FIELDS_MISTAKE : PICK_FIELDS_VOCAB;
  const payload = {};
  pick.forEach(function (k) { if (data[k] != null) payload[k] = typeof data[k] === 'string' ? data[k].trim() : data[k]; });

  const wasEdit = !!f.editId;
  let item = null;
  if (wasEdit) {
    item = S.items.filter(function (i) { return i.id === f.editId; })[0];
    if (!item) { toast('找不到这条记录'); return; }
    Object.assign(item, payload);
  } else {
    item = {
      id: uid('it'),
      subjectId: subject.id,
      template: f.template,
      imageKey: '',
      fieldImages: {},
      createdAt: nowLocalISO(),
      status: 'active',
      nextReviewAt: Review.today(),
      reviewCount: 0,
      streak: 0,
      stem: '', answer: '', analysis: '', knowledgePoint: '', initErrorReason: '', stuckNote: '', hint: '',
      front: '', phonetic: '', back: '', example: '', mySentence: ''
    };
    if (f.template === 'mistake') item.type = payload.type || 'mistake';
    else item.subType = payload.subType || 'word';
    Object.assign(item, payload);
    if (!item.fieldImages) item.fieldImages = {};
    S.items.push(item);
  }

  if (!saveItems()) {
    if (!wasEdit) S.items = S.items.filter(function (i) { return i.id !== item.id; });
    toast('文字也没能保存：本地存储已满，请先导出备份再清理旧记录', 5200);
    return;
  }

  // ---------- 3. 再处理图片：失败只影响图片，文字已落盘 ----------
  let imgMsg = '';
  const oldKey = data.imageKey || '';
  if (f.imageBlob) {
    const newKey = uid('img');
    try {
      await Store.putImage(newKey, f.imageBlob);
      item.imageKey = newKey;
    } catch (e) {
      imgMsg = imgMsg || imageErrText(e);
      if (e && e.name === 'IMAGE_STORE_UNAVAILABLE') degradeImageStore();
    }
  } else if (f.imageRemoved) {
    item.imageKey = '';
  }
  if (oldKey && oldKey !== item.imageKey) {
    try { await Store.deleteImage(oldKey); } catch (e) { /* ignore */ }
    IMG_CACHE.delete(oldKey);
  }

  if (f.template === 'mistake') {
    const fm = Object.assign({}, item.fieldImages || {});
    for (let i = 0; i < FIELD_IMAGE_FIELDS.length; i++) {
      const field = FIELD_IMAGE_FIELDS[i];
      const blob = f.fieldBlobs[field];
      if (!blob) continue;
      const key = uid('img');
      try {
        await Store.putImage(key, blob);
        fm[field] = key;
      } catch (e) {
        imgMsg = imgMsg || imageErrText(e);
        if (e && e.name === 'IMAGE_STORE_UNAVAILABLE') degradeImageStore();
      }
    }
    for (let i = 0; i < FIELD_IMAGE_FIELDS.length; i++) {
      const field = FIELD_IMAGE_FIELDS[i];
      const gone = f.fieldRemovedKeys[field];
      if (!gone) continue;
      delete fm[field];
      try { await Store.deleteImage(gone); } catch (e) { /* ignore */ }
      IMG_CACHE.delete(gone);
    }
    // 丢掉空的 key
    Object.keys(fm).forEach(function (k) { if (!fm[k]) delete fm[k]; });
    item.fieldImages = fm;
  }

  if (!saveItems()) {
    toast('图片信息没能写进本地存储，文字部分已保存', 5200);
  }

  S.form = null;
  checkQuota();
  if (imgMsg) toast(imgMsg, 6000);
  else toast(wasEdit ? '已更新' : '已保存，可以开始复习了', 2200);
  nav(wasEdit ? '#/detail?id=' + item.id : '#/home');
}

/* =========================================================
 * 复习中心
 * ========================================================= */
function pageReviewCenter(params) {
  const subject = currentSubject();
  if (!subject) return '<div class="section"><div class="card">还没有学科。</div></div>';
  if (params.view === 'today' || params.view === 'week') return summaryView(subject, params.view);

  const tpl = templateOf(subject);
  const t = Review.today();
  const rows = tpl.pools.map(function (p) {
    const due = dueItemsOf(subject.id, p.key);
    const total = poolItems(subject.id, p.key).length;
    const avg = Review.avgDwellMs(p.key, S.logs) / 1000;
    return '<div class="card pool">'
      + '<div class="pool-head"><b>' + esc(p.label) + '</b>'
      + '<span class="muted">' + due.length + ' 张到期 / 共 ' + total + ' 张</span></div>'
      + '<div class="hint">平均 ' + Math.round(avg) + ' 秒/张' + (due.length ? ' · 预计 ' + Review.fmtSeconds(due.length * avg) : '') + '</div>'
      + '<div class="btn-row">'
      + '<button class="btn btn-primary" data-act="nav" data-to="#/cards?pool=' + p.key + '"'
      + (due.length ? '' : ' disabled') + '>' + (due.length ? '开始' + p.short + '复习' : '暂无到期') + '</button>'
      + '<button class="btn btn-ghost" data-act="nav" data-to="#/add">＋ 录入</button>'
      + '</div></div>';
  }).join('');

  const daySum = Review.summary(S.items, S.logs, t, t);
  const weekSum = Review.summary(S.items, S.logs, Review.addDays(t, -6), t);

  return ''
    + '<header class="topbar"><div class="topbar-title">复习中心</div>'
    + '<span class="topbar-note">' + Review.today() + '</span></header>'
    + subjectChips()
    + '<section class="section">' + rows + '</section>'
    + '<section class="section">'
    + '<div class="sec-head"><h2>回顾与总结</h2></div>'
    + '<div class="card stack-d">'
    + '<button class="row" data-act="nav" data-to="#/review-center?view=today"><span class="row-main"><b>今日学习回顾</b>'
    + '<span class="row-sub">今天录入 ' + daySum.createdCount + ' 条 · 复习 ' + daySum.reviewedCount + ' 次</span></span><span class="arrow">›</span></button>'
    + '<button class="row" data-act="nav" data-to="#/review-center?view=week"><span class="row-main"><b>本周学习总结</b>'
    + '<span class="row-sub">近 7 天录入 ' + weekSum.createdCount + ' 条 · 复习 ' + weekSum.reviewedCount + ' 次</span></span><span class="arrow">›</span></button>'
    + '</div></section>';
}

function summaryView(subject, view) {
  const t = Review.today();
  const from = view === 'today' ? t : Review.addDays(t, -6);
  const sum = Review.summary(S.items, S.logs, from, t);
  const logs = S.logs.filter(function (l) { return l.date >= from && l.date <= t; });
  const itemMap = new Map();
  S.items.forEach(function (i) { itemMap.set(i.id, i); });

  let body = '';
  if (view === 'week') {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = Review.addDays(t, -i);
      days.push({ d: d, n: S.logs.filter(function (l) { return l.date === d; }).length });
    }
    const max = Math.max.apply(null, days.map(function (x) { return x.n; }).concat([1]));
    body += '<div class="card"><div class="sec-head"><h2>每日复习次数</h2></div><div class="bars">'
      + days.map(function (x) {
        const h = Math.max(4, Math.round((x.n / max) * 64));
        return '<div class="bar-col"><i style="height:' + h + 'px"></i><span>' + fmtDate(x.d) + '</span><b>' + (x.n || '') + '</b></div>';
      }).join('') + '</div></div>';
  }

  const list = logs.slice(-40).reverse().map(function (l) {
    const it = itemMap.get(l.itemId);
    const subject2 = it ? getSubject(it.subjectId) : null;
    let title = '';
    if (it) {
      if (it.template === 'vocabulary') title = it.front || '';
      else title = it.knowledgePoint || (it.stem || '').slice(0, 18) || (it.type === 'no-idea' ? '无思路题' : '错题');
    }
    const label = it ? templateOf(subject2 || subject).ratingLabel(it, l.result) : l.result;
    const goAttr = it ? ' data-act="nav" data-to="#/detail?id=' + it.id + '"' : '';
    return '<button class="log-row log-btn"' + goAttr + '><span class="log-time">' + (l.reviewedAt || '').slice(11, 16) + '</span>'
      + '<span class="log-main"><b>' + esc(title || '—') + '</b>'
      + '<span class="row-sub">' + esc(subject2 ? shortName(subject2.name) : '') + ' · ' + esc(label)
      + (l.dwellMs ? ' · ' + fmtSecShort(l.dwellMs) : '') + (l.tooFast ? ' · 秒过' : '') + '</span></span></button>';
  }).join('');

  return ''
    + '<header class="topbar">'
    + '<button class="btn btn-mini" data-act="nav" data-to="#/review-center">‹ 返回</button>'
    + '<div class="topbar-title">' + (view === 'today' ? '今日学习回顾' : '本周学习总结') + '</div>'
    + '</header>'
    + '<section class="section">'
    + '<div class="card sum"><div class="sum-grid">'
    + '<div><b>' + sum.createdCount + '</b><span>新录入</span></div>'
    + '<div><b>' + sum.reviewedCount + '</b><span>复习次数</span></div>'
    + '<div><b>' + sum.reviewedItemCount + '</b><span>覆盖卡片</span></div>'
    + '</div>'
    + '<div class="kv"><span class="kv-k">平均停留</span><span>' + (sum.avgDwellMs ? fmtSecShort(sum.avgDwellMs) : '—') + '</span></div>'
    + '<div class="kv"><span class="kv-k">秒过</span><span>' + sum.fastCount + ' 张</span></div>'
    + (sum.errorRanking.length ? '<div class="kv kv-top"><span class="kv-k">错因排行</span><div class="tag-wrap">'
      + sum.errorRanking.map(function (r) { return '<span class="tag tag-warn">' + esc(r.reason) + ' ×' + r.count + '</span>'; }).join('') + '</div></div>' : '')
    + (sum.knowledgePoints.length ? '<div class="kv kv-top"><span class="kv-k">知识点</span><div class="tag-wrap">'
      + sum.knowledgePoints.map(function (k) { return '<span class="tag">' + esc(k) + '</span>'; }).join('') + '</div></div>' : '')
    + '</div></section>'
    + body
    + '<section class="section"><div class="sec-head"><h2>复习记录</h2><span class="muted">' + (logs.length ? '最近 ' + Math.min(logs.length, 40) + ' 条' : '') + '</span></div>'
    + (list ? '<div class="card stack-d">' + list + '</div>' : '<div class="card empty">这段时间还没有复习记录。</div>')
    + '</section>';
}

/* =========================================================
 * 卡片复习
 * ========================================================= */
function pageCards(params) {
  const poolKey = params.pool || (templateOf(currentSubject()).pools[0] || {}).key;
  if (!S.card) return cardsStart(poolKey);
  return cardView();
}

function cardsStart(poolKey) {
  const subject = currentSubject();
  if (!subject) return '<div class="section"><div class="card">还没有学科。</div></div>';
  const pool = getPool(subject, poolKey);
  const due = dueItemsOf(subject.id, poolKey);
  const avg = Review.avgDwellMs(poolKey, S.logs) / 1000;
  const minEst = due.length * avg;
  const suggestCount = Math.min(10, Math.max(1, due.length));

  return ''
    + '<header class="topbar">'
    + '<button class="btn btn-mini" data-act="nav" data-to="#/review-center">‹ 返回</button>'
    + '<div class="topbar-title">' + esc(pool.label) + '</div>'
    + '<span class="topbar-note">' + esc(shortName(subject.name)) + '</span>'
    + '</header>'
    + '<section class="section"><div class="card start">'
    + '<div class="start-title">' + (due.length ? due.length + ' 张到期' : '暂时没有到期的卡片') + '</div>'
    + (due.length ? '<div class="start-meta">平均 ' + Math.round(avg) + ' 秒/张 · 全部清完' + Review.fmtSeconds(minEst) + '</div>' : '<div class="start-meta">去录入几条，或者等明天再来。</div>')
    + (due.length ? (
      '<button class="btn btn-primary btn-lg" data-act="start" data-pool="' + poolKey + '">复习全部 ' + due.length + ' 张</button>'
      + '<div class="inline-input"><span>只复习</span><input id="start-count" type="number" min="1" max="' + due.length + '" value="' + suggestCount + '"><span>张</span>'
      + '<button class="btn btn-ghost" data-act="start-count" data-pool="' + poolKey + '">开始</button></div>'
      + '<div class="inline-input"><span>只复习</span><input id="start-min" type="number" min="1" value="10"><span>分钟（约 '
      + Math.max(1, Math.round(600 / Math.max(5, avg))) + ' 张）</span>'
      + '<button class="btn btn-ghost" data-act="start-min" data-pool="' + poolKey + '">开始</button></div>'
      + '<p class="hint">中途退出不影响：评过分的已经记进日志，没评分的还留在到期队列里。</p>'
    ) : '')
    + '</div></section>';
}

function startSession(poolKey, limit) {
  const subject = currentSubject();
  const due = dueItemsOf(subject.id, poolKey);
  if (!due.length) { toast('这个池子没有到期的卡片'); return; }
  const queue = limit && limit > 0 ? due.slice(0, limit) : due.slice();
  S.card = {
    pool: poolKey,
    subjectId: subject.id,
    queue: queue,
    idx: 0,
    rated: 0,
    total: queue.length,
    globalDue: due.length,
    flipped: false,
    errorReason: '',
    accum: 0,
    visibleSince: 0,
    done: false
  };
  resetDwell();
  render();
}

function resetDwell() {
  const c = S.card;
  if (!c) return;
  c.accum = 0;
  c.visibleSince = (typeof document.hidden === 'boolean' ? !document.hidden : true) ? performance.now() : 0;
}
function dwellNow() {
  const c = S.card;
  if (!c) return 0;
  let ms = c.accum || 0;
  if (c.visibleSince) ms += performance.now() - c.visibleSince;
  return Math.max(0, ms);
}
function tickCardTimer() {
  const el = document.getElementById('dwell');
  if (!el || !S.card || !S.settings.showCardTimer) return;
  el.textContent = (dwellNow() / 1000).toFixed(1) + 's';
}

function cardView() {
  const c = S.card;
  if (c.done || c.idx >= c.queue.length) return cardsDone();
  const item = c.queue[c.idx];
  const tpl = REVIEW_TEMPLATES[item.template];
  const ratings = tpl.ratings(item);
  const globalLeft = Math.max(0, c.globalDue - c.rated);
  if (!c.errorReason) {
    const last = S.logs.filter(function (l) { return l.itemId === item.id && l.errorReason; }).slice(-1)[0];
    c.errorReason = last ? last.errorReason : (item.initErrorReason || '');
  }

  return ''
    + '<header class="topbar topbar-flat">'
    + '<button class="btn btn-mini" data-act="exit-cards">‹ 退出</button>'
    + '<div class="topbar-title">本次 ' + (c.rated + 1) + '/' + c.total + '</div>'
    + (S.settings.showCardTimer ? '<span class="timer" id="dwell">0.0s</span>' : '<span class="topbar-note">' + (globalLeft ? '全局还剩 ' + globalLeft : '') + '</span>')
    + '</header>'
    + '<div class="progress"><i style="width:' + Math.round((c.rated / Math.max(1, c.total)) * 100) + '%"></i></div>'
    + '<div class="card-stage">'
    + '<div class="flip' + (c.flipped ? ' flipped' : '') + '" data-act="flip">'
    + '<div class="face front">' + tpl.front(item) + '<div class="face-tip">点击卡片翻面</div></div>'
    + '<div class="face back">' + tpl.back(item) + backExtras(item) + '</div>'
    + '</div></div>'
    + '<div class="rate-bar' + (c.flipped ? '' : ' disabled') + '">'
    + ratings.map(function (r) {
      return '<button class="rate rate-' + r.v + '" data-act="rate" data-result="' + r.v + '"' + (c.flipped ? '' : ' disabled') + '>' + esc(r.t) + '</button>';
    }).join('')
    + '</div>'
    + (globalLeft > 0 && c.total < c.globalDue ? '<div class="remain-note">本次 ' + c.total + ' 张，全局还剩 ' + globalLeft + ' 张在队列里</div>' : '');
}

function backExtras(item) {
  let html = '';
  if (item.template === 'mistake') {
    const subject = getSubject(item.subjectId);
    const opts = (subject && subject.errorReasonOptions) || [];
    const cur = S.card ? S.card.errorReason : '';
    html += '<div class="bk bk-edit"><div class="bk-h">本次错因（可改）</div>'
      + '<div class="chips" data-chip-group="error">'
      + opts.map(function (o) {
        return '<button type="button" class="chip' + (o === cur ? ' is-on' : '') + '" data-act="card-chip" data-value="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('')
      + '</div>'
      + '<input class="input input-sm" id="card-reason" value="' + esc(cur) + '" placeholder="或者自己写一个错因">'
      + '</div>';
  }
  if (item.subType === 'sentence-pattern') {
    html += '<div class="bk bk-edit"><div class="bk-h">我的仿写</div>'
      + '<textarea class="input textarea" id="my-sentence" rows="2" placeholder="造一句自己的">' + esc(item.mySentence || '') + '</textarea>'
      + '<button class="btn btn-ghost btn-sm" data-act="save-sentence">保存仿写</button></div>';
  }
  return html;
}

function cardsDone() {
  const c = S.card || { rated: 0, globalDue: 0, total: 0 };
  const left = Math.max(0, (c.globalDue || 0) - (c.rated || 0));
  return ''
    + '<header class="topbar"><div class="topbar-title">完成</div></header>'
    + '<section class="section"><div class="card done">'
    + '<div class="done-emoji">■</div>'
    + '<div class="start-title">这一轮结束了</div>'
    + '<p class="muted">本次复习 ' + (c.rated || 0) + ' 张，'
    + (left ? '还有 ' + left + ' 张到期，可以再来一轮。' : '到期卡片已清空。') + '</p>'
    + '<div class="btn-row">'
    + '<button class="btn btn-primary" data-act="nav" data-to="#/review-center">回复习中心</button>'
    + '<button class="btn btn-ghost" data-act="nav" data-to="#/overview">看概览</button>'
    + '</div></div></section>';
}

function flipCard(e) {
  const c = S.card;
  if (!c || c.flipped) return;
  if (e && e.target && e.target.closest && e.target.closest('input, textarea, button, label')) return;
  c.flipped = true;
  const flipEl = document.querySelector('.flip');
  if (flipEl) flipEl.classList.add('flipped');
  const bar = document.querySelector('.rate-bar');
  if (bar) {
    bar.classList.remove('disabled');
    $$('button', bar).forEach(function (b) { b.disabled = false; });
  }
}

function rateCard(result) {
  const c = S.card;
  if (!c || !c.flipped) return;
  const item = c.queue[c.idx];
  if (!item) return;
  const reasonInput = document.getElementById('card-reason');
  if (reasonInput) c.errorReason = reasonInput.value.trim();

  const dwellMs = Math.round(dwellNow());
  const tooFast = dwellMs > 0 && dwellMs < APP.tooFastMs;
  const sched = Review.schedule(item, result, Review.today());
  Object.assign(item, sched);
  item.reviewCount = (item.reviewCount || 0) + 1;

  S.logs.push({
    id: uid('log'),
    itemId: item.id,
    itemType: Review.itemTypeOf(item),
    reviewedAt: nowLocalISO(),
    date: Review.today(),
    result: result,
    errorReason: c.errorReason || '',
    note: '',
    dwellMs: dwellMs,
    tooFast: tooFast
  });
  saveItems();
  saveLogs();

  c.rated++;
  c.idx++;
  c.flipped = false;
  c.errorReason = '';
  if (c.idx >= c.queue.length) c.done = true;
  if (!c.done) resetDwell();
  render();
  if (c.done) toast('本轮完成，共 ' + c.rated + ' 张');
}

/* =========================================================
 * 详情
 * ========================================================= */
function pageDetail(params) {
  const item = S.items.filter(function (i) { return i.id === params.id; })[0];
  if (!item) {
    return '<header class="topbar"><button class="btn btn-mini" data-act="back">‹ 返回</button>'
      + '<div class="topbar-title">详情</div></header>'
      + '<section class="section"><div class="card empty">找不到这条记录，可能已被删除。</div></section>';
  }
  const subject = getSubject(item.subjectId);
  const tpl = templateOf(subject || currentSubject());
  const logs = S.logs.filter(function (l) { return l.itemId === item.id; }).slice().reverse();
  const reasons = [];
  logs.forEach(function (l) { if (l.errorReason && reasons.indexOf(l.errorReason) < 0) reasons.push(l.errorReason); });

  let body = '';
  if (item.template === 'mistake') {
    body = (item.imageKey ? '<img class="q-img" data-image-key="' + item.imageKey + '" alt="题目图片">' : '')
      + kv('类型', item.type === 'no-idea' ? '无思路' : '错题')
      + kv('知识点', item.knowledgePoint || '—')
      + kv('题干', item.stem || '—', true)
      + kv('初步错因', item.initErrorReason || '—')
      + kvRich('当时卡点', nl2br(item.stuckNote) + fieldImg(item, 'stuckNote', 'q-img-detail'))
      + (item.type === 'no-idea'
        ? kvRich('思路提示', nl2br(item.hint) + fieldImg(item, 'hint', 'q-img-detail'))
        : kvRich('答案', nl2br(item.answer) + fieldImg(item, 'answer', 'q-img-detail'))
          + kvRich('解析', nl2br(item.analysis) + fieldImg(item, 'analysis', 'q-img-detail')));
  } else {
    body = kv('类型', item.subType === 'word' ? '单词' : '句型')
      + kv('正面', item.front || '—', true)
      + (item.phonetic ? kv('音标', item.phonetic) : '')
      + kv('背面', item.back || '—', true)
      + kv('例句', item.example || '—', true)
      + (item.mySentence ? kv('我的仿写', item.mySentence, true) : '');
  }

  const logRows = logs.map(function (l) {
    return '<div class="log-row"><span class="log-time">' + fmtDate(l.date) + '</span>'
      + '<span class="log-main"><b>' + esc(tpl.ratingLabel(item, l.result)) + '</b>'
      + '<span class="row-sub">' + (l.errorReason ? esc(l.errorReason) : '未填错因')
      + (l.dwellMs ? ' · ' + fmtSecShort(l.dwellMs) : '') + (l.tooFast ? ' · 秒过' : '')
      + '</span></span></div>';
  }).join('');

  return ''
    + '<header class="topbar">'
    + '<button class="btn btn-mini" data-act="back">‹ 返回</button>'
    + '<div class="topbar-title">详情</div>'
    + '<span class="topbar-note">' + esc(subject ? shortName(subject.name) : '') + '</span>'
    + '</header>'
    + '<section class="section"><div class="card">' + body + '</div></section>'
    + '<section class="section"><div class="sec-head"><h2>复习状态</h2></div><div class="card">'
    + kv('状态', item.status === 'archived' ? '已归档（连续 2 次“会了”）' : '在复习队列')
    + kv('下次复习', item.nextReviewAt || '—')
    + kv('已复习', (item.reviewCount || 0) + ' 次')
    + kv('连续记得', (item.streak || 0) + ' 次')
    + (reasons.length ? kv('错因历史', reasons.join(' → '), true) : '')
    + '</div></section>'
    + '<section class="section"><div class="sec-head"><h2>复习记录</h2></div>'
    + (logRows ? '<div class="card stack-d">' + logRows + '</div>' : '<div class="card empty">还没有复习记录。</div>')
    + '</section>'
    + '<section class="section"><div class="btn-row">'
    + '<button class="btn btn-primary" data-act="nav" data-to="#/add?edit=' + item.id + '">编辑</button>'
    + '<button class="btn btn-ghost danger" data-act="delete-item" data-id="' + item.id + '">删除</button>'
    + '</div></section>';
}

function kvRich(k, html) {
  return '<div class="kv kv-block"><span class="kv-k">' + esc(k) + '</span>'
    + '<span class="kv-v">' + (html || '<span class="muted">—</span>') + '</span></div>';
}

function kv(k, v, block) {
  return '<div class="kv' + (block ? ' kv-block' : '') + '"><span class="kv-k">' + esc(k) + '</span>'
    + '<span class="kv-v">' + (block ? esc(v).replace(/\n/g, '<br>') : esc(v)) + '</span></div>';
}

async function deleteItem(id) {
  const item = S.items.filter(function (i) { return i.id === id; })[0];
  if (!item) return;
  if (!confirm('删除这条记录？对应的复习日志和图片也会一起删除，不能恢复。')) return;
  const doomed = [];
  if (item.imageKey) doomed.push(item.imageKey);
  if (item.fieldImages) {
    Object.keys(item.fieldImages).forEach(function (k) {
      if (item.fieldImages[k]) doomed.push(item.fieldImages[k]);
    });
  }
  for (let i = 0; i < doomed.length; i++) {
    try { await Store.deleteImage(doomed[i]); } catch (e) { /* ignore */ }
    IMG_CACHE.delete(doomed[i]);
  }
  S.items = S.items.filter(function (i) { return i.id !== id; });
  S.logs = S.logs.filter(function (l) { return l.itemId !== id; });
  saveItems();
  saveLogs();
  toast('已删除');
  nav('#/home');
}

function pageOverview() {
  const t = Review.today();
  const from7 = Review.addDays(t, -6);
  const dueAll = S.items.filter(function (i) { return Review.isDue(i, t); });
  const logs7 = S.logs.filter(function (l) { return l.date >= from7 && l.date <= t; });

  const groups = ['mistake', 'no-idea', 'word', 'sentence-pattern'].map(function (k) {
    const count = dueAll.filter(function (i) { return Review.itemTypeOf(i) === k; }).length;
    const avg = Review.avgDwellMs(k, S.logs) / 1000;
    return { key: k, count: count, avg: avg, sec: count * avg };
  });
  const totalSec = groups.reduce(function (a, g) { return a + g.sec; }, 0);
  const totalDue = dueAll.length;

  const avg7 = logs7.length / 7;
  const comp = Review.completionRate(S.items, S.logs, 7);
  const avgDwell7 = Review._avgFrom(logs7);
  const fast7 = logs7.filter(function (l) { return l.tooFast; }).length;

  const groupLabel = { mistake: '错题', 'no-idea': '无思路题', word: '单词', 'sentence-pattern': '句型' };
  const groupRows = groups.map(function (g) {
    return '<div class="kv"><span class="kv-k">' + groupLabel[g.key] + '</span>'
      + '<span class="kv-v">' + g.count + ' 张 · 约 ' + Math.round(g.avg) + ' 秒/张'
      + (g.count ? ' · ' + Review.fmtSeconds(g.sec) : '') + '</span></div>';
  }).join('');

  // 学科拆分
  const subjRows = S.subjects.map(function (s) {
    const items = S.items.filter(function (i) { return i.subjectId === s.id; });
    const due = items.filter(function (i) { return Review.isDue(i, t); });
    return '<div class="kv"><span class="kv-k">' + esc(shortName(s.name)) + '</span>'
      + '<span class="kv-v">共 ' + items.length + ' 条 · 到期 ' + due.length + '</span></div>';
  }).join('');

  // 知识点 / 词性分布
  const kpMap = new Map();
  S.items.forEach(function (i) {
    if (i.template === 'mistake' && i.knowledgePoint) {
      kpMap.set(i.knowledgePoint, (kpMap.get(i.knowledgePoint) || 0) + 1);
    }
  });
  const kpArr = Array.from(kpMap.entries()).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
  const kpMax = kpArr.length ? kpArr[0][1] : 1;
  const kpHTML = kpArr.length ? kpArr.map(function (e) {
    return '<div class="dist-row"><span class="dist-k">' + esc(e[0]) + '</span>'
      + '<span class="dist-bar"><i style="width:' + Math.round((e[1] / kpMax) * 100) + '%"></i></span>'
      + '<b>' + e[1] + '</b></div>';
  }).join('') : '<div class="muted small">还没有标注知识点的错题。</div>';

  const subMap = { word: 0, 'sentence-pattern': 0 };
  S.items.forEach(function (i) { if (i.template === 'vocabulary' && subMap[i.subType] != null) subMap[i.subType]++; });
  const subHTML = '<div class="kv"><span class="kv-k">单词 / 句型</span><span class="kv-v">' + subMap.word + ' / ' + subMap['sentence-pattern'] + '</span></div>';

  // 错因排行
  const rank = Review.errorRanking(S.logs, 6);
  const rankMax = rank.length ? rank[0].count : 1;
  const rankHTML = rank.length ? rank.map(function (r) {
    return '<div class="dist-row"><span class="dist-k">' + esc(r.reason) + '</span>'
      + '<span class="dist-bar"><i class="warn" style="width:' + Math.round((r.count / rankMax) * 100) + '%"></i></span>'
      + '<b>' + r.count + '</b></div>';
  }).join('') : '<div class="muted small">还没有错因记录，复习时选一下错因就会出现排行。</div>';

  return ''
    + '<header class="topbar"><div class="topbar-title">概览</div><span class="topbar-note">' + t + '</span></header>'
    + '<section class="section">'
    + '<div class="card hero">'
    + '<div class="hero-num">' + totalDue + '</div>'
    + '<div class="hero-label">张卡片待复习</div>'
    + '<div class="hero-sub">全部清完' + (totalDue ? Review.fmtSeconds(totalSec) : '') + '</div>'
    + '<div class="btn-row"><button class="btn btn-primary" data-act="nav" data-to="#/review-center"'
    + (totalDue ? '' : ' disabled') + '>去复习</button></div>'
    + '</div></section>'
    + '<section class="section">'
    + '<div class="sec-head"><h2>按类型拆分</h2></div>'
    + '<div class="card">' + groupRows + '</div>'
    + '</section>'
    + '<section class="section">'
    + '<div class="sec-head"><h2>近 7 天</h2></div>'
    + '<div class="card"><div class="sum-grid">'
    + '<div><b>' + avg7.toFixed(1) + '</b><span>日均复习</span></div>'
    + '<div><b>' + Math.round(comp.rate * 100) + '%</b><span>完成率</span></div>'
    + '<div><b>' + (avgDwell7 ? (avgDwell7 / 1000).toFixed(1) + 's' : '—') + '</b><span>平均停留</span></div>'
    + '</div>'
    + '<div class="kv"><span class="kv-k">到期池</span><span class="kv-v">' + comp.done + ' / ' + comp.pool + ' 张已复习</span></div>'
    + '<div class="kv"><span class="kv-k">秒过</span><span class="kv-v">' + fast7 + ' 张（停留不足 2 秒，不计入平均耗时样本）</span></div>'

async function runDiagnostics() {
  const t0 = Date.now();
  const L = [];
  L.push('错题回顾助手 · 存储诊断');
  L.push('时间：' + nowLocalISO());
  L.push('协议：' + location.protocol + (location.protocol === 'file:' ? '（file:// 非安全上下文，IndexedDB 与相机常被限制）' : ''));
  L.push('secureContext：' + (window.isSecureContext ? 'yes' : 'no'));
  L.push('UA：' + navigator.userAgent);
  L.push('');

  const hasIDB = !!window.indexedDB;
  L.push('indexedDB 存在：' + (hasIDB ? 'yes' : 'no'));
  let db = null;
  if (hasIDB) {
    try {
      db = await Store.openDB();
      L.push('openDB：ok');
    } catch (e) {
      L.push('openDB：失败 error.name=' + ((e && e.name) || '?') + ' message=' + ((e && e.message) || ''));
    }
  }

  if (db) {
    const id = '__diag_' + Date.now();
    try {
      await Store.putImage(id, new Blob([new Uint8Array([1, 2, 3])], { type: 'image/png' }));
      L.push('put 测试：ok');
    } catch (e) {
      L.push('put 测试：失败 error.name=' + ((e && e.name) || '?') + ' message=' + ((e && e.message) || ''));
    }
    try {
      const b = await Store.getImage(id);
      L.push('get 测试：' + (b ? 'ok（' + b.size + 'B）' : '返回空'));
    } catch (e) {
      L.push('get 测试：失败 error.name=' + ((e && e.name) || '?'));
    }
    try {
      await Store.deleteImage(id);
      L.push('delete 测试：ok');
    } catch (e) {
      L.push('delete 测试：失败 error.name=' + ((e && e.name) || '?'));
    }
  } else {
    L.push('put/get/delete 测试：跳过（IndexedDB 不可用）');
  }

  let lsOK = false;
  let lsErr = '';
  try {
    localStorage.setItem('__diag_ls__', '1');
    localStorage.removeItem('__diag_ls__');
    lsOK = true;
  } catch (e) {
    lsErr = ' error.name=' + ((e && e.name) || '?');
  }
  L.push('localStorage 可写：' + (lsOK ? 'yes' : 'no' + lsErr));
  L.push('localStorage 图片兜底占用：' + Math.round(Store._lsImageBytes() / 1024) + 'KB / 上限 ' + Math.round(APP.lsImageBudget / 1024) + 'KB');
  L.push('localStorage 键数量：' + localStorage.length);

  if (navigator.storage && navigator.storage.estimate) {
    try {
      const est = await Promise.race([
        navigator.storage.estimate(),
        new Promise(function (resolve) { setTimeout(function () { resolve('timeout'); }, 3000); })
      ]);
      if (est === 'timeout') throw new Error('estimate 超时');
      const u = est.usage || 0;
      const q = est.quota || 0;
      L.push('storage.estimate：usage=' + u + 'B quota=' + q + 'B（' + (q ? (u / q * 100).toFixed(1) : '0') + '%）');
    } catch (e) {
      L.push('storage.estimate：失败 ' + ((e && e.message) || (e && e.name) || '?'));
    }
  } else {
    L.push('storage.estimate：不支持');
  }

  L.push('');
  L.push('最后一次数据写入异常：' + (Store.lastSaveError
    ? (Store.lastSaveError.name + ' @ ' + Store.lastSaveError.where + ' @ ' + Store.lastSaveError.at)
    : '无'));
  L.push('最后一次图片写入异常：' + (Store.lastImageError
    ? (Store.lastImageError.name + ' @ ' + Store.lastImageError.where + ' @ ' + Store.lastImageError.at)
    : '无'));
  L.push('当前图片后端：' + Store.imageBackend + '（IMG_DISABLED=' + IMG_DISABLED + '）');
  L.push('条目 ' + S.items.length + ' 条 / 日志 ' + S.logs.length + ' 条');
  L.push('耗时：' + (Date.now() - t0) + 'ms');

  DIAG_TEXT = L.join('\n');
  render();
  toast('诊断完成，结果在下方，可复制', 2600);
}

async function copyDiag() {
  if (!DIAG_TEXT) { toast('先点开始诊断'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(DIAG_TEXT);
      toast('已复制到剪贴板');
      return;
    }
  } catch (e) { /* 继续走选中兜底 */ }
  const el = document.getElementById('diag-out');
  if (el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast('已选中，长按或右键复制', 3000);
  } else {
    toast('没有可复制的内容');
  }
}

/* =========================================================
 * 提醒
 * ========================================================= */
function dueSentence() {
  const t = Review.today();
  const segs = [];
  let total = 0;
  let totalSec = 0;
  S.subjects.forEach(function (s) {
    const due = S.items.filter(function (i) { return i.subjectId === s.id && Review.isDue(i, t); });
    if (!due.length) return;
    total += due.length;
    const tpl = templateOf(s);
    const parts = [];
    tpl.pools.forEach(function (p) {
      const n = due.filter(function (i) { return !p.test || p.test(i); }).length;
      if (n) {
        parts.push(n + ' ' + p.unit + p.noun);
        totalSec += n * (Review.avgDwellMs(p.key, S.logs) / 1000);
      }
    });
    segs.push(shortName(s.name) + ' ' + parts.join('、'));
  });
  if (!total) return { total: 0, text: '今天没有到期的卡片，可以整理一下新错题。' };
  return {
    total: total,
    text: '今天有 ' + total + ' 项待回顾：' + segs.join('；') + '。点此开始' + Review.fmtSeconds(totalSec) + '的回顾。'
  };
}

function checkReminder() {
  const s = S.settings;
  if (!s || !s.remindTime) return;
  const today = Review.today();
  if (s.lastRemindDate === today) return;

  const now = new Date();
  const hm = String(s.remindTime).split(':');
  const targetMin = (parseInt(hm[0], 10) || 0) * 60 + (parseInt(hm[1], 10) || 0);
  if (now.getHours() * 60 + now.getMinutes() < targetMin) return;

  const info = dueSentence();
  if (!info.total) return;

  s.lastRemindDate = today;
  Store.saveSettings(s);
  S.banner = info.text;
  renderBanner();

  if (s.notifyOn && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification('错题回顾助手', { body: info.text, tag: 'mra-remind' });
      n.onclick = function () { window.focus(); nav('#/review-center'); n.close(); };
    } catch (e) { /* ignore */ }
  }
}

function renderBanner() {
  const el = document.getElementById('banner');
  if (!el) return;
  if (!S.banner) { el.innerHTML = ''; el.className = 'banner-slot'; return; }
  el.className = 'banner-slot on';
  el.innerHTML = '<div class="banner" data-act="banner-go">'
    + '<div class="banner-text">' + esc(S.banner) + '</div>'
    + '<button class="banner-x" data-act="dismiss-banner" aria-label="关闭">×</button>'
    + '</div>';
}

  const act = el.dataset.act;

  // 卡片翻面：整个卡片区域可点
  if (act === 'flip') { flipCard(e); return; }

  switch (act) {
    case 'nav': {
      const sub = el.dataset.subject;
      if (sub && sub !== S.subjectId) {
        S.subjectId = sub;
        S.settings.currentSubjectId = sub;
        Store.saveSettings(S.settings);
        S.card = null;
      }
      nav(el.dataset.to);
      break;
    }
    case 'back':
      if (history.length > 1) history.back();
      else nav('#/home');
      break;
    case 'switch-subject':
      S.subjectId = el.dataset.id;
      S.settings.currentSubjectId = S.subjectId;
      Store.saveSettings(S.settings);
      if (S.route.name === 'add') S.form = null;
      S.card = null;
      render();
      break;
    case 'chip': {
      if (!S.form) break;
      S.form.data[el.dataset.field] = el.dataset.value;
      rerenderFields();
      break;
    }
    case 'card-chip': {
      if (!S.card) break;
      const v = el.dataset.value;
      S.card.errorReason = v;
      const group = el.closest('.chips');
      if (group) $$('.chip', group).forEach(function (c) { c.classList.toggle('is-on', c === el); });
      const inp = document.getElementById('card-reason');
      if (inp) inp.value = v;
      break;
    }
    case 'remove-field-image': removeFieldImage(el.dataset.field); break;
    case 'storage-diag': runDiagnostics(); break;
    case 'copy-diag': copyDiag(); break;
    case 'remove-image':
      if (!S.form) break;
      S.form.imageBlob = null;
      S.form.imageRemoved = true;
      S.form.data.imageKey = '';
      if (S.form.previewUrl) { URL.revokeObjectURL(S.form.previewUrl); S.form.previewUrl = ''; }
      rerenderFields();
      break;
    case 'save-item': saveItem(); break;
    case 'start': startSession(el.dataset.pool, null); break;
    case 'start-count': {
      const n = parseInt((document.getElementById('start-count') || {}).value, 10);
      startSession(el.dataset.pool, n > 0 ? n : null);
      break;
    }
    case 'start-min': {
      const m = parseInt((document.getElementById('start-min') || {}).value, 10);
      const avg = Review.avgDwellMs(el.dataset.pool, S.logs) / 1000;
      const n = Math.max(1, Math.floor((m || 10) * 60 / Math.max(5, avg)));
      startSession(el.dataset.pool, n);
      break;
    }
    case 'rate': rateCard(el.dataset.result); break;
    case 'save-sentence': {
      const c = S.card;
      if (!c) break;
      const item = c.queue[c.idx];
      const ta = document.getElementById('my-sentence');
      if (item && ta) {
        item.mySentence = ta.value.trim();
        saveItems();
        toast('仿写已保存');
      }
      break;
    }
    case 'exit-cards':
      S.card = null;
      nav('#/review-center');
      break;
    case 'delete-item': deleteItem(el.dataset.id); break;
    case 'calc-plan': {
      const n = parseInt((document.getElementById('plan-count') || {}).value, 10) || 1;
      const total = S.items.filter(function (i) { return Review.isDue(i, Review.today()); }).length;
      const out = document.getElementById('plan-days');
      if (out) out.textContent = Math.ceil(total / n) || 0;
      break;
    }
    case 'add-subject': addSubject(); break;
    case 'del-subject': delSubject(el.dataset.id); break;
    case 'ai-pick': {
      const v = el.dataset.value;
      const i = S.aiPick.indexOf(v);
      if (i >= 0) S.aiPick.splice(i, 1); else S.aiPick.push(v);
      pageAI._advice = pageAI._advice || '';
      render();
      break;
    }
    case 'ai-advice': genOfflineAdvice(); break;
    case 'export': doExport(); break;
    case 'import': {
      const inp = document.getElementById('import-file');
      if (inp) inp.click();
      break;
    }
    case 'clear-all': clearAll(); break;
    case 'banner-go': nav('#/review-center'); break;
    case 'dismiss-banner': S.banner = ''; renderBanner(); break;
  }
}

function onInput(e) {
  const t = e.target;
  if (!t) return;
  if (t.dataset && t.dataset.field && S.form) {
    S.form.data[t.dataset.field] = t.value;
  }
  if (t.id === 'card-reason' && S.card) {
    S.card.errorReason = t.value;
    const group = document.querySelector('.chips[data-chip-group="error"]');
    if (group) $$('.chip', group).forEach(function (c) { c.classList.toggle('is-on', c.dataset.value === t.value); });
  }
}

function onChange(e) {
  const t = e.target;
  if (!t) return;
  if (t.id === 'img-input') { handleImagePick(t.files && t.files[0]); return; }
  if (t.dataset && t.dataset.fieldImg) { handleFieldImagePick(t.dataset.fieldImg, t.files && t.files[0]); return; }
  if (t.id === 'import-file') { handleImportFile(t.files && t.files[0]); return; }

  if (t.dataset && t.dataset.setting) {
    const key = t.dataset.setting;
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (key === 'dailyGoalMin') v = Math.max(0, parseInt(v, 10) || 0);
    S.settings[key] = v;
    Store.saveSettings(S.settings);
    if (key === 'notifyOn' && v) requestNotifyPermission();
    if (key === 'showCardTimer') render();
    return;
  }
  if (t.dataset && t.dataset.ai) {
    const key = t.dataset.ai;
    S.settings.ai[key] = t.type === 'checkbox' ? t.checked : t.value;
    Store.saveSettings(S.settings);
    return;
  }
}

function onVisibility() {
  if (S.card) {
    if (document.hidden) {
      if (S.card.visibleSince) {
        S.card.accum += performance.now() - S.card.visibleSince;
        S.card.visibleSince = 0;
      }
    } else if (!S.card.visibleSince) {
      S.card.visibleSince = performance.now();
    }
  }
  if (!document.hidden) checkReminder();
}

/* ---------------- 容量检测 ---------------- */
let QUOTA_NOTE = '';
let QUOTA_LAST = null;
async function checkQuota() {
  try {
    const est = await Store.estimate();
    if (!est) return;
    const note = est.ratio > APP.quotaWarnRatio
      ? '本地存储已用约 ' + Math.round(est.ratio * 100) + '%，建议先导出备份并清理旧图。' + (est.note ? '（' + est.note + '）' : '')
      : '';
    if (note !== QUOTA_LAST) {
      QUOTA_LAST = note;
      QUOTA_NOTE = note;
      if (S.route.name === 'settings') render();
    }
  } catch (e) { /* 忽略 */ }
}

function requestNotifyPermission() {
  if (!('Notification' in window)) { toast('这个浏览器不支持通知'); return; }
  if (Notification.permission === 'granted') return;
  if (Notification.permission === 'denied') { toast('通知权限被拒绝了，站内横幅仍然有效'); return; }
  try {
    Notification.requestPermission().then(function (p) {
      if (p !== 'granted') toast('没有拿到通知权限，站内横幅提醒仍然有效');
    }).catch(function () { toast('通知权限申请失败，站内横幅提醒仍然有效'); });
  } catch (e) {
    toast('通知权限申请失败，站内横幅提醒仍然有效');
  }
}

/* ---------------- 学科增删 ---------------- */
function addSubject() {
  const nameEl = document.getElementById('new-subject-name');
  const tplEl = document.getElementById('new-subject-template');
  const reasonEl = document.getElementById('new-subject-reasons');
  const name = (nameEl.value || '').trim();
  const tpl = tplEl.value;
  if (!name) { toast('先给学科起个名字'); return; }
  if (S.subjects.some(function (s) { return s.name === name; })) { toast('已有同名学科'); return; }
  const reasons = (reasonEl.value || '').split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean);
  const id = 'custom-' + Date.now().toString(36);
  const sub = {
    id: id,
    name: name,
    reviewTemplate: tpl,
    errorReasonOptions: reasons.length ? reasons : ['概念不清', '粗心', '其他'],
    custom: true
  };
  if (tpl === 'vocabulary') sub.vocabSubTypes = ['word', 'sentence-pattern'];
  const list = Store.getCustomSubjects();
  list.push(sub);
  Store.saveCustomSubjects(list);
  S.subjects = Store.getSubjects();
  S.subjectId = id;
  S.settings.currentSubjectId = id;
  Store.saveSettings(S.settings);
  toast('已添加「' + name + '」');
  render();
}

function delSubject(id) {
  const sub = getSubject(id);
  if (!sub) return;
  const n = S.items.filter(function (i) { return i.subjectId === id; }).length;
  if (!confirm('删除学科「' + sub.name + '」？该学科下 ' + n + ' 条记录也会一起删除。')) return;
  const doomedImages = S.items
    .filter(function (i) { return i.subjectId === id && i.imageKey; })
    .map(function (i) { return i.imageKey; });
  S.items = S.items.filter(function (i) { return i.subjectId !== id; });
  S.logs = S.logs.filter(function (l) {
    return S.items.some(function (i) { return i.id === l.itemId; });
  });
  saveItems(); saveLogs();
  doomedImages.forEach(function (key) {
    Store.deleteImage(key).catch(function () {});
    IMG_CACHE.delete(key);
  });
  const list = Store.getCustomSubjects().filter(function (s) { return s.id !== id; });
  Store.saveCustomSubjects(list);
  S.subjects = Store.getSubjects();
  if (S.subjectId === id) {
    S.subjectId = S.subjects[0] ? S.subjects[0].id : '';
    S.settings.currentSubjectId = S.subjectId;
    Store.saveSettings(S.settings);
  }
  toast('已删除学科');
  render();
}

/* ---------------- 导出 / 导入 / 清空 ---------------- */
async function doExport() {
  try {
    const bundle = await Store.exportBundle();
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mistake-review-backup-' + Review.today() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
    toast('已导出 ' + bundle.items.length + ' 条记录、' + Object.keys(bundle.images).length + ' 张图片');
  } catch (e) {
    toast('导出失败：' + (e.message || '未知错误'), 4000);
  }
}

async function handleImportFile(file) {
  if (!file) return;
  if (!confirm('导入会覆盖当前全部数据（条目、复习记录、图片、设置、自定义学科）。确定继续？')) return;
  try {
    const text = await file.text();
    let bundle;
    try { bundle = JSON.parse(text); } catch (e) { toast('文件不是合法 JSON'); return; }
    const r = await Store.importBundle(bundle);
    S.settings = Store.getSettings();
    S.subjects = Store.getSubjects();
    S.items = Store.getItems();
    S.logs = Store.getLogs();
    S.subjectId = S.settings.currentSubjectId || (S.subjects[0] || {}).id;
    if (!getSubject(S.subjectId) && S.subjects[0]) S.subjectId = S.subjects[0].id;
    IMG_CACHE.clear();
    toast('导入完成：' + r.items + ' 条记录、' + r.images + ' 张图片' + (r.imgFail ? '（' + r.imgFail + ' 张图片失败）' : ''), 4000);
    nav('#/home');
  } catch (e) {
    toast('导入失败：' + (e.message || '未知错误'), 5000);
  }
}

async function clearAll() {
  if (!confirm('清空全部数据？条目、日志、图片、设置都会被删除，无法恢复。')) return;
  if (!confirm('再确认一次：真的要清空吗？建议先导出备份。')) return;
  await Store.wipe();
  IMG_CACHE.clear();
  S.settings = Store.getSettings();
  S.subjects = Store.getSubjects();
  S.items = [];
  S.logs = [];
  S.subjectId = S.subjects[0].id;
  toast('已清空');
  nav('#/home');
}

/* ---------------- 启动 ---------------- */
document.addEventListener('DOMContentLoaded', boot);
</script>
